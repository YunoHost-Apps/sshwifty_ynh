#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "sshwifty"
name = "Sshwifty"
description.en = "Web SSH & Telnet (WebSSH & WebTelnet client)"
description.fr = "Web SSH et Telnet (client Web SSH et Web Telnet)"

version = "0.4.8~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "AGPL-3.0"
demo = "https://sshwifty-demo.nirui.org/"
code = "https://github.com/nirui/sshwifty"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.password]
    type = "password"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/nirui/sshwifty/releases/download/0.4.8-beta-release-prebuild/sshwifty_0.4.8-beta-release_linux_amd64.tar.gz"
    amd64.sha256 = "b95726dfdfad51e28c735ba01c481f14b0c28ce084c39b22d4fc2ce3e907ed08"
    arm64.url = "https://github.com/nirui/sshwifty/releases/download/0.4.8-beta-release-prebuild/sshwifty_0.4.8-beta-release_linux_arm64.tar.gz"
    arm64.sha256 = "507c5ee2b80786c1566255593afe9bb9dc806bf775393c607630917c5bf5d70c"
    armhf.url = "https://github.com/nirui/sshwifty/releases/download/0.4.8-beta-release-prebuild/sshwifty_0.4.8-beta-release_linux_arm.tar.gz"
    armhf.sha256 = "257e57403861d6417adc7e5a4694fd891403523820796227ad0c7fac2e15f124"

    autoupdate.strategy = "latest_github_release"
    autoupdate.version_regex = "^(.*)-beta-release-prebuild$"
    autoupdate.asset.amd64 = "sshwifty_.*_linux_amd64.tar.gz"
    autoupdate.asset.arm64 = "sshwifty_.*_linux_arm64.tar.gz"
    autoupdate.asset.armhf = "sshwifty_.*_linux_arm.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
