#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "sshwifty"
name = "Sshwifty"
description.en = "Web SSH & Telnet (WebSSH & WebTelnet client)"
description.fr = "Web SSH et Telnet (client Web SSH et Web Telnet)"

version = "0.4.10~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "AGPL-3.0"
demo = "https://sshwifty-demo.nirui.org/"
code = "https://github.com/nirui/sshwifty"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.password]
    type = "password"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/nirui/sshwifty/releases/download/0.4.10-beta-release-prebuild/sshwifty_0.4.10-beta-release_linux_amd64.tar.gz"
    amd64.sha256 = "fa06b6be1b8bfdfa2499b5b79b48413c3475dfddad73fb09f2b8dfa3ac04a32a"
    arm64.url = "https://github.com/nirui/sshwifty/releases/download/0.4.10-beta-release-prebuild/sshwifty_0.4.10-beta-release_linux_arm64.tar.gz"
    arm64.sha256 = "795764f48f2cd9d52dfcba713f1141eeb0ff0da943ffe87d2e6aef088f5c7f6d"
    armhf.url = "https://github.com/nirui/sshwifty/releases/download/0.4.10-beta-release-prebuild/sshwifty_0.4.10-beta-release_linux_arm.tar.gz"
    armhf.sha256 = "46dd51eaaa4682db7e40c0b1c195f83f36b9396092746531c6a444920c905c6c"

    autoupdate.strategy = "latest_github_release"
    autoupdate.version_regex = "^(.*)-beta-release-prebuild$"
    autoupdate.asset.amd64 = "sshwifty_.*_linux_amd64.tar.gz"
    autoupdate.asset.arm64 = "sshwifty_.*_linux_arm64.tar.gz"
    autoupdate.asset.armhf = "sshwifty_.*_linux_arm.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
