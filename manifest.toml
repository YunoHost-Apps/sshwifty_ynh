#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "sshwifty"
name = "Sshwifty"
description.en = "Web SSH & Telnet (WebSSH & WebTelnet client)"
description.fr = "Web SSH et Telnet (client Web SSH et Web Telnet)"

version = "0.4.11~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "AGPL-3.0"
demo = "https://sshwifty-demo.nirui.org/"
code = "https://github.com/nirui/sshwifty"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.password]
    type = "password"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    amd64.url = "https://github.com/nirui/sshwifty/releases/download/0.4.11-beta-release-prebuild/sshwifty_0.4.11-beta-release_linux_amd64.tar.gz"
    amd64.sha256 = "eb30fb71bb9cd91df00108fe66e753c352f14478cbd80e1e60a641178777e4ab"
    arm64.url = "https://github.com/nirui/sshwifty/releases/download/0.4.11-beta-release-prebuild/sshwifty_0.4.11-beta-release_linux_arm64.tar.gz"
    arm64.sha256 = "3792c191497f64cd2f15fb33b5e0fcc4b1fb6f143a1cb3efb6ff5e774a06cb04"
    armhf.url = "https://github.com/nirui/sshwifty/releases/download/0.4.11-beta-release-prebuild/sshwifty_0.4.11-beta-release_linux_arm.tar.gz"
    armhf.sha256 = "d0b194c0365c2e913cacd34861c194701e2f99c9d62dc06b3eadfe751f847e96"

    autoupdate.strategy = "latest_github_release"
    autoupdate.version_regex = "^(.*)-beta-release-prebuild$"
    autoupdate.asset.amd64 = "sshwifty_.*_linux_amd64.tar.gz"
    autoupdate.asset.arm64 = "sshwifty_.*_linux_arm64.tar.gz"
    autoupdate.asset.armhf = "sshwifty_.*_linux_arm.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
